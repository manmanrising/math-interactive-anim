<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>数学题交互动图 · 示例</title>
<style>
  :root{
    --bg:#f5f6f8;--card:#fff;--ink:#1d1d1f;--sub:#6e6e73;--line:#e6e6ea;
    --blue:#0a84ff;--purple:#5e5ce6;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased;
  }
  header{background:linear-gradient(135deg,#0a84ff,#5e5ce6);color:#fff;padding:44px 24px 38px;text-align:center}
  header h1{margin:0 0 8px;font-size:26px;font-weight:600;letter-spacing:.3px}
  header p{margin:0;opacity:.9;font-size:14px}
  main{max-width:760px;margin:26px auto 40px;padding:0 18px;display:grid;gap:14px}
  a.card{
    display:block;text-decoration:none;color:inherit;background:var(--card);
    border:1px solid var(--line);border-radius:16px;padding:20px 22px;
    box-shadow:0 1px 3px rgba(0,0,0,.05);transition:.18s;
  }
  a.card:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(10,132,255,.14);border-color:#cfe0ff}
  a.card h2{margin:0 0 4px;font-size:17px;font-weight:600;color:var(--ink)}
  a.card p{margin:0;font-size:13.5px;color:var(--sub)}
  a.card .go{float:right;color:var(--blue);font-size:13px;font-weight:600;margin-top:2px}
  footer{text-align:center;color:var(--sub);font-size:12.5px;padding:0 20px 40px}
  footer a{color:var(--blue);text-decoration:none}
</style>
</head>
<body>
  <header>
    <h1>数学题交互动图</h1>
    <p>拖动滑块，亲眼看见「为什么是这个答案」</p>
  </header>
  <main>
    <a class="card" href="assets/example-numberline.html">
      <span class="go">打开 →</span>
      <h2>一维数轴动点</h2>
      <p>两个动点同时运动、分段往返、距离命中徽标</p>
    </a>
    <a class="card" href="assets/example-parabola.html">
      <span class="go">打开 →</span>
      <h2>抛物线动点面积</h2>
      <p>动点扫过抛物线，实时观察面积变化与最值</p>
    </a>
    <a class="card" href="https://github.com/">
      <span class="go">查看 →</span>
      <h2>math-interactive-anim 技能</h2>
      <p>零依赖、可离线、手机直接拖 —— WorkBuddy 技能</p>
    </a>
  </main>
  <footer>
    由 <b>math-interactive-anim</b> 生成 · 纯 SVG + 原生 JS，无外部依赖
  </footer>
</body>
</html>
